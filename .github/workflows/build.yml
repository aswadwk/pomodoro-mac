name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build & upload artifact
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read app version
        id: version
        run: |
          # Source of truth: MARKETING_VERSION in project.yml (e.g. 0.1.0).
          VERSION="$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::MARKETING_VERSION not found in project.yml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Build (Release)
        run: make release

      - name: Create DMG
        run: |
          # Use create-dmg (not plain hdiutil) so the installer window shows the
          # app icon next to an Applications shortcut for drag-to-install.
          brew install create-dmg
          STAGING="$(mktemp -d)"
          cp -R .build/DerivedData/Build/Products/Release/Focus.app "$STAGING"/
          rm -f Focus.dmg
          create-dmg \
            --volname Focus \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 120 \
            --icon "Focus.app" 150 180 \
            --app-drop-link 390 180 \
            --no-internet-enable \
            --format UDZO \
            Focus.dmg "$STAGING"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Unique name per run: upload-artifact v4 does not merge artifacts on
          # re-upload, so a per-run suffix avoids collisions between re-runs.
          name: app-build-${{ github.run_id }}
          path: |
            .build/DerivedData/Build/Products/Release/Focus.app
            Focus.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish DMG to GitHub Releases
    needs: build
    # Only publish a release when code lands on main (merge/push to main).
    # PRs and workflow_dispatch still build & test above, but never release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}+${{ github.run_number }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.1
        with:
          name: app-build-${{ github.run_id }}
          path: dist

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag = semver from project.yml + build number, unique per merge
          # (e.g. v0.1.0+42). GitHub auto-marks the newest as "latest", so
          # releases/latest keeps pointing at the freshest build.
          # Notes = full commit message of the merged commit (no checkout needed).
          COMMIT_MSG="$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.sha }}" --jq '.commit.message')"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" dist/Focus.dmg \
            --title "Focus v${VERSION} (build ${{ github.run_number }})" \
            --notes "$COMMIT_MSG" \
            --target "${{ github.sha }}"

  cleanup:
    name: Clean up old artifacts (keep last 5)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete oldest artifacts, keep 5 latest
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const pattern = /^app-build-/;
            const keep = 5;

            let page = 1;
            let artifacts = [];
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              artifacts = artifacts.concat(data.artifacts);
              if (data.artifacts.length < 100) break;
              page += 1;
            }

            const candidates = artifacts
              .filter((a) => pattern.test(a.name))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            console.log(
              `${candidates.length} artifact(s) match "app-build-*", keeping the ${keep} most recent`
            );

            for (const artifact of candidates.slice(keep)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted ${artifact.name} (created ${artifact.created_at})`);
            }
