name: Focus
options:
  bundleIdPrefix: com.aswad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Focus:
    type: application
    platform: macOS
    sources:
      - Focus
    info:
      path: Focus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Focus
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aswad.Focus
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      gatherCoverageData: false
      testTargets:
        - FocusTests
        - FocusFeatureTests
  FocusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FocusTests
      - TestSupport
    dependencies:
      - target: Focus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aswad.FocusTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Focus.app/Contents/MacOS/Focus
        BUNDLE_LOADER: $(TEST_HOST)
  FocusFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - FocusFeatureTests
      - TestSupport
    dependencies:
      - target: Focus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aswad.FocusFeatureTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Focus.app/Contents/MacOS/Focus
        BUNDLE_LOADER: $(TEST_HOST)
